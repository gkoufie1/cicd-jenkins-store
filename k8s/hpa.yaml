apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: storetrack
  namespace: storetrack
  labels:
    app.kubernetes.io/name: storetrack
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: storetrack
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
